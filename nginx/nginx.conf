events {
    worker_connections 1024;
}

http {
    # Rate limiting zone for API requests to prevent spam/DDoS
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Point to the frontend container
    upstream frontend {
        server mitorix_frontend:3000;
    }

    # Point to the backend container
    upstream backend {
        server mitorix_backend:5000;
    }

    server {
        listen 80;
        server_name localhost; # Change this to your domain when deploying to AWS

        # Redirect API requests to the backend
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Allow large payload bodies for repository parsing if needed
            client_max_body_size 50M;
        }


        # Everything else goes to the frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
