services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./backend/qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/6333" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:alpine
    container_name: mitorix_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mongodb:
    image: mongo:7
    container_name: mitorix_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: mitorix_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h          # Keep model loaded in RAM — no cold starts
      - OLLAMA_MAX_LOADED_MODELS=1     # Focus all RAM on nomic-embed-text
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/11434" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    image: mitorix-backend:latest
    build: ./backend
    container_name: mitorix_backend
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      # - MONGO_URI=mongodb://mongodb:27017/Mitorix
      # - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # - OLLAMA_BASE_URL=http://ollama:11434
      # The rest are picked up from the .env file automatically
    depends_on:
      # mongodb:
      #   condition: service_healthy
      redis:
        condition: service_healthy
      # qdrant:
      #   condition: service_healthy
      # ollama:
      #   condition: service_healthy
    restart: unless-stopped

  frontend:
    image: mitorix-frontend:latest
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: mitorix_frontend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mitorix_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  ollama_data:
