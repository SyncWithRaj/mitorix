version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./backend/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: repolens_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: repolens_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    image: repolens-backend:latest
    build: ./backend
    container_name: repolens_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/RepoLens
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # The rest are picked up from the .env file automatically
    depends_on:
      - mongodb
      - redis
      - qdrant
    restart: unless-stopped

  frontend:
    image: repolens-frontend:latest
    build: ./frontend
    container_name: repolens_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Important: In production, the browser needs to talk to the backend.
      # If accessing via localhost:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
