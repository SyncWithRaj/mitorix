name: Gemini PR Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          head -c 50000 pr_diff.txt > safe_diff.txt

      - name: Run Gemini PR Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        with:
          script: |
            const fs = require('fs');

            if (!process.env.GEMINI_API_KEY) {
              core.setFailed('GOOGLE_API_KEY secret is missing! Please add GOOGLE_API_KEY in GitHub Repo Settings -> Secrets -> Actions.');
              return;
            }

            const diff = fs.readFileSync('safe_diff.txt', 'utf8');

            if (!diff || !diff.trim()) {
              console.log('No code changes found in backend/ or frontend/ for this PR diff.');
              return;
            }

            const headerText = 'You are an expert senior software engineer performing a code review on a Pull Request.\n\n' +
              'Review the following Git diff and provide constructive feedback:\n' +
              '1. 🐛 **Bugs & Edge Cases**: Logic flaws, missing null/undefined checks, unhandled async errors.\n' +
              '2. 🔒 **Security**: Hardcoded secrets, injection risks, authentication/authorization gaps.\n' +
              '3. ⚡ **Performance**: Unnecessary re-renders, unindexed queries, blocking loops.\n' +
              '4. 💡 **Code Quality**: Readability, maintainability, TypeScript typing improvements.\n\n' +
              'If the PR implementation is clean and well-structured, keep your response short and praise the clean code. Format response cleanly using Markdown.\n\n' +
              'Git Diff:\n```diff\n';

            const prompt = headerText + diff + '\n```';

            try {
              const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + process.env.GEMINI_API_KEY, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }]
                })
              });

              const data = await response.json();
              const reviewText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

              if (!reviewText) {
                console.error('Gemini API Error Response:', JSON.stringify(data));
                core.setFailed('Gemini API failed to return text response: ' + (data?.error?.message || 'Unknown error'));
                return;
              }

              const commentBody = '### 🤖 Gemini AI Code Review\n\n' + reviewText + '\n\n---\n*Powered by Gemini 2.5 Flash via GitHub Actions*';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
              console.log('Successfully posted Gemini AI code review comment on PR #' + context.issue.number);
            } catch (err) {
              console.error('Error running Gemini PR Review:', err);
              core.setFailed('Gemini review action failed: ' + err.message);
            }
